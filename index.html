          if (vendidos > 0) {
            toast(`Não é possível excluir: ${vendidos} unidade(s) deste lote já foram vendidas/baixadas. Edite a produção para reduzir a quantidade, se necessário.`, 'err');
            return;
          }
          const p = findProduto(pr.produtoId);
          confirmDelete(`Excluir a produção do lote "${pr.lote}" (${pr.quantidade} un.)? O estoque do produto${DB.config.deducaoInsumos==='producao' ? ' e dos insumos usados' : ''} será revertido.`, () => {
            if (p) {
              p.estoque = Math.max(0, (p.estoque || 0) - pr.quantidade);
              if (DB.config.deducaoInsumos === 'producao') { deduzInsumos(p, -pr.quantidade);
                persist('insumos'); }
            }
            DB.producoes = DB.producoes.filter(x => x.id !== pr.id);
            persist('producoes', 'produtos');
            render();
            toast('Produção excluída', 'ok');
          });
        });
      }

      if (ROUTE === 'etiquetas') {
        const loteSel = document.getElementById('f-lote');
        const statusSel = document.getElementById('f-status');
        if (loteSel) loteSel.onchange = refreshLabelsSheet;
        if (statusSel) statusSel.onchange = refreshLabelsSheet;
        refreshLabelsSheet();
        const printBtn = document.getElementById('btnPrintLabels');
        if (printBtn) printBtn.onclick = printCurrentLabels;
        const customizeBtn = document.getElementById('btnCustomizeLabel');
        if (customizeBtn) customizeBtn.onclick = openEtiquetaLayoutModal;
        ETQ_FILTER_LOTE = null;
      }

      if (ROUTE === 'vendas') {
        const scanInp = document.getElementById('saleScanInput');
        if (scanInp) {
          scanInp.onkeydown = (e) => { if (e.key === 'Enter' && scanInp.value.trim()) { addScanToCart(scanInp.value
              .trim());
              scanInp.value = ''; } };
        }
        
        const saleManualInp = document.getElementById('saleManualInput');
        const btnSaleManual = document.getElementById('btnSaleManual');
        if (saleManualInp) {
          saleManualInp.onkeydown = (e) => { 
            if (e.key === 'Enter' && saleManualInp.value.trim()) { 
              addScanToCart(saleManualInp.value.trim()); 
              saleManualInp.value = ''; 
            } 
          };
        }
        if (btnSaleManual) {
          btnSaleManual.onclick = () => {
            const code = saleManualInp.value.trim();
            if (code) {
              addScanToCart(code);
              saleManualInp.value = '';
            } else {
              toast('Digite um código válido', 'err');
            }
          };
        }
        
        const addManualBtn = document.getElementById('btnAddManual');
        if (addManualBtn) addManualBtn.onclick = () => {
          addManualToCart(document.getElementById('manualProduto').value, parseInt(document.getElementById(
            'manualQtd').value) || 1);
        };
        document.querySelectorAll('[data-cartdel]').forEach(b => b.onclick = () => { SALE_CART.splice(parseInt(b.dataset
            .cartdel), 1);
          render(); });
        document.querySelectorAll('[data-cartqty]').forEach(b => b.onclick = () => {
          const idx = parseInt(b.dataset.cartqty);
          const d = parseInt(b.dataset.d);
          SALE_CART[idx].qty = Math.max(1, SALE_CART[idx].qty + d);
          render();
        });
        const fin = document.getElementById('btnFinalizarVenda');
        if (fin) fin.onclick = finalizarVenda;
        const clr = document.getElementById('btnLimparCarrinho');
        if (clr) clr.onclick = () => { SALE_CART = [];
          render(); };
        const camBtn = document.getElementById('btnSaleCamera');
        if (camBtn) camBtn.onclick = () => {
          if (CameraScan.active.vendas) { 
            CameraScan.active.vendas = false;
            stopCamera('vendas');
            render(); 
          } else { 
            CameraScan.active.vendas = true;
            render();
            setTimeout(() => startCamera('vendas', 'saleCameraReader', (code) => { 
              addScanToCart(code); 
            }), 100);
          }
        };
        if (CameraScan.active.vendas) {
          setTimeout(() => startCamera('vendas', 'saleCameraReader', (code) => { 
            addScanToCart(code); 
          }), 100);
        }
      }

      if (ROUTE === 'bipagem') {
        const bipInp = document.getElementById('bipInput');
        if (bipInp) {
          bipInp.onkeydown = (e) => { if (e.key === 'Enter' && bipInp.value.trim()) { processBipagem(bipInp.value
              .trim());
              bipInp.value = ''; } };
        }
        
        const bipManualInp = document.getElementById('bipManualInput');
        const btnBipManual = document.getElementById('btnBipManual');
        if (bipManualInp) {
          bipManualInp.onkeydown = (e) => { 
            if (e.key === 'Enter' && bipManualInp.value.trim()) { 
              processBipagem(bipManualInp.value.trim()); 
              bipManualInp.value = ''; 
            } 
          };
        }
        if (btnBipManual) {
          btnBipManual.onclick = () => {
            const code = bipManualInp.value.trim();
            if (code) {
              processBipagem(code);
              bipManualInp.value = '';
            } else {
              toast('Digite um código válido', 'err');
            }
          };
        }
        
        const camBtn = document.getElementById('btnTryCamera');
        if (camBtn) camBtn.onclick = () => {
          if (CameraScan.active.bipagem) { 
            CameraScan.active.bipagem = false;
            stopCamera('bipagem');
            render(); 
          } else { 
            CameraScan.active.bipagem = true;
            render();
            setTimeout(() => startCamera('bipagem', 'cameraReader', (code) => { 
              processBipagem(code); 
            }), 100);
          }
        };
        if (CameraScan.active.bipagem) {
          setTimeout(() => startCamera('bipagem', 'cameraReader', (code) => { 
            processBipagem(code); 
          }), 100);
        }
      }

      if (ROUTE === 'relatorios') {
        document.querySelectorAll('[data-rel]').forEach(b => b.onclick = () => { REL_TAB = b.dataset.rel;
          render(); });
        const de = document.getElementById('relDe'),
          ate = document.getElementById('relAte');
        if (de) de.onchange = renderRelContent;
        if (ate) ate.onchange = renderRelContent;
        renderRelContent();
        const exp = document.getElementById('btnExportCsv');
        if (exp) exp.onclick = exportCsv;
      }

      if (ROUTE === 'config') {
        // Salvar configurações
        document.getElementById('btnSalvarConfig').onclick = () => {
          DB.config = {
            ...DB.config,
            nome: document.getElementById('cf-nome').value.trim(),
            whatsapp: document.getElementById('cf-whats').value.trim(),
            instagram: document.getElementById('cf-insta').value.trim(),
            origem: document.getElementById('cf-origem').value.trim(),
            cuidados: document.getElementById('cf-cuidados').value,
            deducaoInsumos: document.getElementById('cf-deducao').value,
          };
          persist('config');
          toast('Configurações salvas', 'ok');
          render();
        };
        
        // Exportar JSON
        const btnExport = document.getElementById('btnExportJson');
        if (btnExport) {
          btnExport.onclick = exportAllData;
        }
        
        // Importar JSON
        const fileInput = document.getElementById('fileInput');
        if (fileInput) {
          fileInput.onchange = (e) => {
            if (e.target.files && e.target.files.length > 0) {
              importAllData(e.target.files[0]);
              fileInput.value = ''; // Limpa o input
            }
          };
        }
      }
    }

    /* ---------------- init ---------------- */
    (async function init() {
      await loadAll();
      render();
    })();
  </script>
</body>
</html>
