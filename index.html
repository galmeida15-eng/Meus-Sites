<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doce Gestão">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5C3A26">
<title>Almeida Doceria Gourmet · Sistema de Gestão ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.js">
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js">
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js">
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #FDF8F3;
    --surface: #FFFFFF;
    --surface-2: #F5EDE3;
    --ink: #3A2A24;
    --muted: #8C7A6E;
    --line: #E4D9CF;
    --wine: #8B5A3C;
    --wine-dark: #5C3A26;
    --wine-light: #EFE3D8;
    --gold: #C29A6B;
    --gold-light: #F7EFE2;
    --green: #5E8C6D;
    --green-light: #EAF3EC;
    --red: #B25E4A;
    --red-light: #F6EAE5;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(58, 42, 36, .04), 0 6px 20px rgba(58, 42, 36, .06);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    min-height: 100dvh;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }

  h1,
  h2,
  h3,
  h4 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }

  .mono {
    font-family: 'IBM Plex Mono', monospace;
  }

  a {
    color: inherit;
  }

  button {
    font-family: inherit;
  }

  ::selection {
    background: var(--wine-light);
  }

  /* ---------- layout shell ---------- */
  #app {
    display: flex;
    min-height: 100dvh;
  }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--wine-dark);
    color: #F5EDE3;
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .brand {
    padding: 0 20px 18px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, .12);
    margin-bottom: 10px;
  }

  .brand-title {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    color: #fff;
    font-weight: 600;
    line-height: 1.15;
  }

  .brand-sub {
    font-size: 10.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: #D4C0B2;
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 6px 10px;
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    color: #D4C0B2;
    text-decoration: none;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    border: none;
    background: transparent;
    text-align: left;
    width: 100%;
    transition: background .12s;
  }

  .nav-item svg {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    opacity: .85;
  }

  .nav-item:hover {
    background: rgba(255, 255, 255, .08);
    color: #fff;
  }

  .nav-item.active {
    background: #fff;
    color: var(--wine-dark);
  }

  .nav-item.active svg {
    opacity: 1;
  }

  .nav-foot {
    padding: 12px 20px 4px 20px;
    font-size: 10.5px;
    color: #B8A294;
    font-family: 'IBM Plex Mono', monospace;
    border-top: 1px solid rgba(255, 255, 255, .12);
  }

  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 20;
    padding-top: max(18px, env(safe-area-inset-top));
  }

  .topbar h1 {
    font-size: 22px;
  }

  .topbar .sub {
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 2px;
  }

  .content {
    padding: 24px 28px 60px 28px;
    max-width: 1180px;
    width: 100%;
  }

  /* mobile bottom nav & iOS fixes */
  .mobile-nav {
    display: none;
  }

  @media (max-width:880px) {
    .sidebar {
      display: none;
    }
    #app {
      flex-direction: column;
    }
    .mobile-nav {
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      gap: 4px;
      background: var(--wine-dark);
      padding: 8px 10px;
      position: sticky;
      top: 0;
      z-index: 30;
      padding-top: max(8px, env(safe-area-inset-top));
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }
    .mobile-nav::-webkit-scrollbar {
      display: none;
    }
    .mobile-nav button {
      flex-shrink: 0;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: #D4C0B2;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 13px;
      min-height: 40px;
      border-radius: 9px;
      font-family: 'Manrope';
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-nav button svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      opacity: .85;
    }
    .mobile-nav button.active {
      background: #fff;
      color: var(--wine-dark);
    }
    .mobile-nav button.active svg {
      opacity: 1;
    }
    .content {
      padding: 16px 14px 76px 14px;
    }
    /* topbar não fica fixo no mobile — evita sobrepor a barra de navegação
       e libera espaço de tela; título encolhe e ações viram largura total */
    .topbar {
      position: static;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px 16px 16px;
    }
    .topbar h1 {
      font-size: 19px;
    }
    #topbarActions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #topbarActions:empty {
      display: none;
    }
    #topbarActions .btn {
      width: 100%;
      justify-content: center;
      min-height: 44px;
    }
    /* Impede zoom automatico no iPhone ao focar em inputs */
    .input,
    select,
    textarea {
      font-size: 16px !important;
    }
    /* alvos de toque maiores em botões e ícones de ação */
    .btn {
      min-height: 40px;
    }
    .btn-sm {
      min-height: 34px;
      padding: 7px 12px;
    }
    .icon-btn {
      padding: 10px;
      min-width: 38px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    td [data-adj],
    td .icon-btn {
      margin: 2px;
    }
    table {
      font-size: 13px;
    }
    th, td {
      padding: 10px 9px;
    }
    .stat {
      padding: 14px 15px;
    }
    .stat .value {
      font-size: 21px;
    }
    .stat .label {
      font-size: 10px;
    }
    .stat .delta {
      font-size: 11px;
    }
    /* modais viram "bottom sheet" — mais fáceis de preencher com o polegar */
    .modal-backdrop {
      align-items: flex-end;
      padding: 0;
    }
    .modal {
      max-width: 100%;
      width: 100%;
      max-height: 92vh;
      border-radius: 18px 18px 0 0;
      animation: sheetup .18s ease-out;
    }
    .modal-foot {
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
  }

  @keyframes sheetup {
    from { transform: translateY(24px); opacity: .4; }
    to { transform: translateY(0); opacity: 1; }
  }

  @media (max-width:480px) {
    .field-row {
      flex-direction: column;
      gap: 0;
    }
    .grid-4 {
      grid-template-columns: 1fr;
    }
    .chart-wrap {
      height: 220px;
    }
  }

  /* ---------- primitives ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .card-pad {
    padding: 20px;
  }

  .grid {
    display: grid;
    gap: 16px;
  }

  .grid-4 {
    grid-template-columns: repeat(4, 1fr);
  }

  .grid-3 {
    grid-template-columns: repeat(3, 1fr);
  }

  .grid-2 {
    grid-template-columns: repeat(2, 1fr);
  }

  @media (max-width:880px) {
    .grid-4 {
      grid-template-columns: repeat(2, 1fr);
    }
    .grid-3,
    .grid-2 {
      grid-template-columns: 1fr;
    }
  }

  .stat {
    padding: 18px 20px;
  }

  .stat .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
  }

  .stat .value {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    margin-top: 6px;
    color: var(--ink);
  }

  .stat .delta {
    font-size: 12px;
    margin-top: 6px;
    color: var(--muted);
  }

  .stat .delta.up {
    color: var(--green);
  }

  .stat .delta.down {
    color: var(--red);
  }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 28px 0 12px 0;
  }

  .section-title h2 {
    font-size: 17px;
  }

  .section-title:first-child {
    margin-top: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
  }

  td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tbody tr:hover {
    background: var(--surface-2);
  }

  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
  }

  .badge-ok {
    background: var(--green-light);
    color: var(--green);
  }

  .badge-warn {
    background: var(--gold-light);
    color: #8a6a1c;
  }

  .badge-danger {
    background: var(--red-light);
    color: var(--red);
  }

  .badge-muted {
    background: var(--surface-2);
    color: var(--muted);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 16px;
    border-radius: 9px;
    border: 1px solid transparent;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    transition: filter .1s, transform .05s;
    font-family: 'Manrope';
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active {
    transform: translateY(1px);
  }

  .btn-primary {
    background: var(--wine);
    color: #fff;
  }

  .btn-primary:hover {
    filter: brightness(1.08);
  }

  .btn-secondary {
    background: var(--surface);
    border-color: var(--line);
    color: var(--ink);
  }

  .btn-secondary:hover {
    background: var(--surface-2);
  }

  .btn-danger {
    background: var(--red-light);
    color: var(--red);
  }

  .btn-danger:hover {
    filter: brightness(.97);
  }

  .btn-gold {
    background: var(--gold);
    color: #fff;
  }

  .btn-sm {
    padding: 6px 11px;
    font-size: 12px;
    border-radius: 7px;
  }

  .btn-icon {
    padding: 7px;
    border-radius: 8px;
  }

  .btn:disabled {
    opacity: .45;
    cursor: not-allowed;
  }

  .input,
  select,
  textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 14px;
    font-family: 'Manrope';
    color: var(--ink);
  }

  .input:focus,
  select:focus,
  textarea:focus {
    outline: 2px solid var(--wine-light);
    border-color: var(--wine);
  }

  label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  .field {
    margin-bottom: 14px;
  }

  .field-row {
    display: flex;
    gap: 12px;
  }

  .field-row>div {
    flex: 1;
  }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
  }

  .empty h3 {
    color: var(--ink);
    margin-bottom: 6px;
    font-size: 16px;
  }

  .empty p {
    font-size: 13px;
    max-width: 360px;
    margin: 0 auto;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(58, 42, 36, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    backdrop-filter: blur(2px);
  }

  .modal {
    background: var(--surface);
    border-radius: 16px;
    max-width: 520px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
  }

  .modal-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-body {
    padding: 20px 22px;
  }

  .modal-foot {
    padding: 16px 22px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--muted);
    line-height: 1;
  }

  .toast-wrap {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom));
    right: 20px;
    left: 20px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }

  .toast {
    background: var(--ink);
    color: #fff;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
    max-width: 380px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    animation: toastin .18s ease-out;
    pointer-events: auto;
  }

  .toast.ok {
    background: var(--green);
  }

  .toast.err {
    background: var(--red);
  }

  @keyframes toastin {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .tag-num {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--gold-light);
    color: #7A5D3A;
    border-radius: 6px;
    padding: 1px 6px;
    font-size: 11px;
    font-weight: 600;
  }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .divider {
    height: 1px;
    background: var(--line);
    margin: 18px 0;
  }

  .pill-tabs {
    display: flex;
    gap: 6px;
    background: var(--surface-2);
    padding: 4px;
    border-radius: 10px;
    width: fit-content;
    flex-wrap: wrap;
  }

  .pill-tab {
    padding: 7px 14px;
    border-radius: 8px;
    border: none;
    background: transparent;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--muted);
  }

  .pill-tab.active {
    background: #fff;
    color: var(--wine);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
  }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    padding: 8px;
    border-radius: 6px;
  }

  .icon-btn:hover {
    background: var(--surface-2);
    color: var(--ink);
  }

  /* label card — tamanhos/fontes controláveis via variáveis CSS (personalização em Etiquetas) */
  .label-card {
    width: var(--lbl-w, 340px);
    min-height: var(--lbl-min-h, 0);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 16px 18px;
    background: #fff;
    position: relative;
    font-family: var(--lbl-font-body, 'Manrope'), system-ui, sans-serif;
    font-size: var(--lbl-size-body, 0.3cm);
    break-inside: avoid;
  }

  .label-eyebrow {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    font-weight: 700;
  }

  .label-name {
    font-family: var(--lbl-font-title, 'Fraunces'), serif;
    font-size: var(--lbl-size-title, 0.5cm);
    font-weight: 700;
    margin-top: 1px;
    line-height: 1.15;
    padding-right: 34px;
  }

  .label-num {
    position: absolute;
    top: 16px;
    right: 16px;
    font-family: var(--lbl-font-title, 'Fraunces'), serif;
    font-weight: 700;
    font-size: 17px;
  }

  .label-row {
    display: flex;
    gap: 16px;
    margin-top: 9px;
    font-size: var(--lbl-size-body, 0.32cm);
  }

  .label-row b {
    font-size: calc(var(--lbl-size-body, 0.32cm) + 0.03cm);
  }

  .label-qr-wrap {
    position: relative;
    margin-top: 12px;
    text-align: right;
  }

  .label-qr-wrap img {
    width: var(--lbl-qr-size, 76px);
    height: var(--lbl-qr-size, 76px);
    border-radius: 8px;
    border: 1px solid var(--line);
  }

  .label-code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: var(--lbl-size-code, 0.25cm);
    margin-top: 3px;
    color: var(--muted);
  }

  .label-care {
    font-size: var(--lbl-size-body, 0.3cm);
    margin-top: 10px;
    line-height: 1.5;
  }

  .label-care b {
    display: block;
    font-size: calc(var(--lbl-size-body, 0.3cm) + 0.015cm);
    margin-bottom: 3px;
  }

  .label-contact {
    font-size: var(--lbl-size-body, 0.3cm);
    margin-top: 9px;
    line-height: 1.6;
  }

  .label-contact b {
    display: block;
    font-size: var(--lbl-size-body, 0.3cm);
    margin-bottom: 2px;
  }

  .labels-sheet {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  @media print {
    body * {
      visibility: hidden;
    }
    #print-area,
    #print-area * {
      visibility: visible;
    }
    #print-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px;
    }
    .label-card {
      box-shadow: none;
    }
  }

  /* scanner */
  .scan-box {
    border: 2px dashed var(--wine-light);
    border-radius: 16px;
    padding: 26px;
    text-align: center;
    background: var(--wine-light);
  }

  .scan-input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px;
    text-align: center;
    padding: 14px;
    letter-spacing: .03em;

<body>
  <div id="app">
    <nav class="sidebar">
      <div class="brand">
        <div class="brand-title">Almeida Doceria Gourmet</div>
        <div class="brand-sub">sistema de gestão ERP</div>
      </div>
      <div class="nav" id="nav"></div>
      <div class="nav-foot" id="syncStatus">conectando à nuvem…</div>
    </nav>
    <div class="mobile-nav" id="mobileNav"></div>
    <div class="main">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">Painel</h1>
          <div class="sub" id="pageSub"></div>
        </div>
        <div id="topbarActions"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div class="toast-wrap" id="toastWrap"></div>
  <div id="print-area" style="display:none;"></div>

  <script>
    /* ---------------- helpers ---------------- */
    const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const nowISO = () => new Date().toISOString();
    const fmtMoney = (v) => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const fmtDate = (iso) => { if (!iso) return '—'; const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString(
        'pt-BR'); };
    const fmtDateTime = (iso) => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('pt-BR') +
        ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
    const addDays = (iso, days) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + Number(days || 0)); return d
        .toISOString().slice(0, 10); };
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;' } [c]));
    const slug = (s) => (s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9]+/g, '')
      .slice(0, 6) || 'PRD';

    function toast(msg, type) {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => { el.style.transition = 'opacity .25s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 250); }, 3200);
    }

    /* ---------------- Firebase (sincronização entre dispositivos) ---------------- */
    const firebaseConfig = {
      apiKey: "AIzaSyAilD82v6VDUgw3L5R7Ff97hmuIMRuEGO4",
      authDomain: "erp-almeida-doceria-gourmet.firebaseapp.com",
      projectId: "erp-almeida-doceria-gourmet",
      storageBucket: "erp-almeida-doceria-gourmet.firebasestorage.app",
      messagingSenderId: "148710389779",
      appId: "1:148710389779:web:e442c148d779ffb3b467e6",
    };

    let fsDb = null;
    let firebaseReady = false;

    function setSyncStatus(text) {
      const el = document.getElementById('syncStatus');
      if (el) el.textContent = text;
    }

    try {
      firebase.initializeApp(firebaseConfig);
      fsDb = firebase.firestore();
      firebaseReady = true;
      setSyncStatus('sincronizado com a nuvem');
    } catch (e) {
      console.error('Falha ao iniciar Firebase', e);
      setSyncStatus('modo offline (sem nuvem)');
    }

    /* ---------------- storage (Firestore + cache local, compatível com iPhone/iOS Safari) ---------------- */
    const STORE_KEYS = ['config', 'insumos', 'produtos', 'producoes', 'vendas', 'scanlog', 'etiquetaLayout'];
    let DB = { config: null, insumos: null, produtos: null, producoes: null, vendas: null, scanlog: null, etiquetaLayout: null };
    let LAST_SAVED_JSON = {}; // usado para ignorar o eco da própria escrita ao ouvir o Firestore

    function defaultEtiquetaLayout() {
      return {
        larguraCm: 9,
        alturaCm: 6,
        alturaAuto: true,
        fonteTitulo: 'Fraunces',
        fonteCorpo: 'Manrope',
        tamanhoTitulo: 0.5,
        tamanhoCorpo: 0.3,
        tamanhoCodigo: 0.25,
        tamanhoQr: 76,
        mostrarPeso: true,
        mostrarCuidados: true,
        mostrarContato: true,
        textoEyebrow: 'Descrição do produto',
        textoCuidadosTitulo: '⚠ Cuidados & Conservação',
        textoContatoTitulo: 'Atendimento / Vendas',
      };
    }

    function defaultConfig() {
      return {
        nome: 'Almeida Doce Gourmet',
        whatsapp: '(32) 98448-1635',
        instagram: 'almeidadocergourmet',
        origem: 'Miraí - MG',
        cuidados: 'Manter em local fresco, seco e ao abrigo da luz solar.\nApós aberto, consumir em até 3 dias.\nEvitar armazenar próximo a produtos com cheiro forte.',
        deducaoInsumos: 'producao'
      };
    }

    function seedData() {
      const leite = { id: uid(), nome: 'Leite Condensado', unidade: 'un', estoque: 24, estoqueMin: 6, custo: 5.20 };
      const choc = { id: uid(), nome: 'Chocolate em Pó', unidade: 'kg', estoque: 3.5, estoqueMin: 1, custo: 24.00 };
      const bolacha = { id: uid(), nome: 'Bolacha Maisena', unidade: 'kg', estoque: 5, estoqueMin: 2, custo: 9.80 };
      const insumos = [leite, choc, bolacha];
      const produtos = [{
        id: uid(),
        nome: 'Palha Italiana Tradicional',
        sku: 'PLH-TRAD',
        categoria: 'Doces',
        preco: 8.00,
        validadeDias: 3,
        estoque: 0,
        estoqueMin: 10,
        pesoMedio: 0.15,
        receita: [
          { insumoId: leite.id, qtd: 0.08 },
          { insumoId: choc.id, qtd: 0.03 },
          { insumoId: bolacha.id, qtd: 0.05 },
        ]
      }];
      return { insumos, produtos };
    }

    async function loadKey(key, fallback) {
      try {
        if (firebaseReady) {
          const snap = await fsDb.collection('erp_data').doc(key).get();
          if (snap.exists && snap.data().json != null) {
            const json = snap.data().json;
            LAST_SAVED_JSON[key] = json;
            localStorage.setItem('docemg_' + key, json);
            return JSON.parse(json);
          }
        }
        const local = localStorage.getItem('docemg_' + key);
        if (local != null) return JSON.parse(local);
        return fallback;
      } catch (e) {
        console.error(e);
        const local = localStorage.getItem('docemg_' + key);
        if (local != null) return JSON.parse(local);
        return fallback;
      }
    }

    async function saveKey(key, value) {
      const json = JSON.stringify(value);
      LAST_SAVED_JSON[key] = json;
      localStorage.setItem('docemg_' + key, json);
      try {
        if (firebaseReady) {
          setSyncStatus('salvando…');
          await fsDb.collection('erp_data').doc(key).set({
            json,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setSyncStatus('sincronizado com a nuvem');
        }
      } catch (e) {
        toast('Não foi possível sincronizar com a nuvem (salvo só neste dispositivo)', 'err');
        setSyncStatus('erro de sincronização');
        console.error(e);
      }
    }

    async function loadAll() {
      const seeded = seedData();
      DB.config = await loadKey('config', defaultConfig());
      DB.insumos = await loadKey('insumos', seeded.insumos);
      DB.produtos = await loadKey('produtos', seeded.produtos);
      DB.producoes = await loadKey('producoes', []);
      DB.vendas = await loadKey('vendas', []);
      DB.scanlog = await loadKey('scanlog', []);
      DB.etiquetaLayout = await loadKey('etiquetaLayout', defaultEtiquetaLayout());
      if (firebaseReady) startRealtimeSync();
    }

    function startRealtimeSync() {
      STORE_KEYS.forEach((key) => {
        fsDb.collection('erp_data').doc(key).onSnapshot((snap) => {
          if (!snap.exists) return;
          const json = snap.data().json;
          if (json == null || json === LAST_SAVED_JSON[key]) return; // ignora eco da própria escrita
          LAST_SAVED_JSON[key] = json;
          try {
            DB[key] = JSON.parse(json);
            localStorage.setItem('docemg_' + key, json);
            render();
            toast('Dados atualizados em outro dispositivo', 'ok');
          } catch (e) { console.error(e); }
        }, (err) => {
          console.error('Erro no listener do Firestore', err);
          setSyncStatus('erro de sincronização');
        });
      });
    }

    function persist(...keys) { keys.forEach(k => saveKey(k, DB[k])); }

    /* ---------------- lookups ---------------- */
    const findInsumo = (id) => DB.insumos.find(i => i.id === id);
    const findProduto = (id) => DB.produtos.find(p => p.id === id);

    function produtoLowStock(p) { return p.estoque <= p.estoqueMin; }

    function insumoLowStock(i) { return i.estoque <= i.estoqueMin; }

    function findItemByCode(code) {
      code = (code || '').trim().toUpperCase();
      if (!code) return null;
      for (const prod of DB.producoes) {
        const it = prod.itens.find(x => x.codigo.toUpperCase() === code);
        if (it) return { producao: prod, item: it };
      }
      return null;
    }

    function deduzInsumos(produto, qty) {
      const out = [];
      (produto.receita || []).forEach(r => {
        const ins = findInsumo(r.insumoId);
        if (!ins) return;
        const amount = r.qtd * qty;
        ins.estoque = Math.round((ins.estoque - amount) * 10000) / 10000;
        out.push({ insumo: ins, deducted: amount });
      });
      return out;
    }

    /* ---------------- app / router state ---------------- */
    let ROUTE = 'dashboard';
    let SALE_CART = [];

    const NAV_ITEMS = [
      { id: 'dashboard', label: 'Painel', icon: iconDash },
      { id: 'estoque', label: 'Estoque & Insumos', icon: iconLayers },
      { id: 'produtos', label: 'Produtos', icon: iconTag },
      { id: 'producao', label: 'Produção', icon: iconBox },
      { id: 'vendas', label: 'Vendas', icon: iconCart },
      { id: 'bipagem', label: 'Bipagem', icon: iconScan },
      { id: 'etiquetas', label: 'Etiquetas', icon: iconTicket },
      { id: 'relatorios', label: 'Relatórios', icon: iconChart },
      { id: 'config', label: 'Configurações', icon: iconGear },
    ];

    function iconDash() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>'; }

    function iconLayers() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>'; }

    function iconTag() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 11v0a2 2 0 0 0 0 2.8l7.2 7.2a2 2 0 0 0 2.8 0L21 13V4a2 2 0 0 0-2-2h-7Z"/><circle cx="16" cy="8" r="1.4"/></svg>'; }

    function iconBox() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3.5 7 8.5-4 8.5 4-8.5 4-8.5-4Z"/><path d="M3.5 7v10l8.5 4 8.5-4V7"/><path d="M12 11v10"/></svg>'; }

    function iconCart() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3h2l2.6 12.6a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/></svg>'; }

    function iconScan() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 1 2 2h3M21 16v3a2 2 0 0 1-2 2h-3M3 12h18"/></svg>'; }

    function iconTicket() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.5a1.5 1.5 0 0 0 0 3V15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.5a1.5 1.5 0 0 0 0-3V9Z"/><path d="M9 7v10" stroke-dasharray="2 2"/></svg>'; }

    function iconChart() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V10M11 19V5M18 19v-7"/><path d="M2 21h20"/></svg>'; }

    function iconGear() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l1.9-1.5-2-3.4-2.2.9a8 8 0 0 0-2.6-1.5L14 2h-4l-.5 2.3a8 8 0 0 0-2.6 1.5l-2.2-.9-2 3.4L4.6 10a7.9 7.9 0 0 0 0 3l-1.9 1.5 2 3.4 2.2-.9c.8.7 1.7 1.2 2.6 1.5L10 22h4l.5-2.3c.9-.3 1.8-.8 2.6-1.5l2.2.9 2-3.4-1.9-1.5Z"/></svg>'; }

    function renderNav() {
      const nav = document.getElementById('nav');
      nav.innerHTML = NAV_ITEMS.map(it => `
          <button class="nav-item ${ROUTE===it.id?'active':''}" data-route="${it.id}">${it.icon()}<span>${it.label}</span></button>
        `).join('');
      nav.querySelectorAll('.nav-item').forEach(b => b.onclick = () => setRoute(b.dataset.route));

      const mnav = document.getElementById('mobileNav');
      mnav.innerHTML = NAV_ITEMS.map(it => `<button class="${ROUTE===it.id?'active':''}" data-route="${it.id}">${it.icon()}<span>${it.label}</span></button>`)
        .join('');
      mnav.querySelectorAll('button').forEach(b => b.onclick = () => setRoute(b.dataset.route));
      const activeBtn = mnav.querySelector('button.active');
      if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function setRoute(r) {
      if (ROUTE !== r) {
        if (CameraScan.active.vendas && r !== 'vendas') { CameraScan.active.vendas = false;
          stopCamera('vendas'); }
        if (CameraScan.active.bipagem && r !== 'bipagem') { CameraScan.active.bipagem = false;
          stopCamera('bipagem'); }
      }
      ROUTE = r;
      render();
    }

    const TITLES = {
      dashboard: ['Painel', 'Visão geral do seu negócio'],
      estoque: ['Estoque & Insumos', 'Matérias-primas e níveis de estoque'],
      produtos: ['Produtos', 'Cadastro de itens e fichas técnicas'],
      producao: ['Produção', 'Registre lotes produzidos e gere etiquetas'],
      vendas: ['Vendas', 'Registre vendas por bipagem ou manualmente'],
      bipagem: ['Bipagem', 'Saída rápida de itens por QR Code'],
      etiquetas: ['Etiquetas', 'Gere e reimprima etiquetas com QR Code'],
      relatorios: ['Relatórios', 'Faturamento, consumo e desempenho'],
      config: ['Configurações', 'Dados da empresa usados nas etiquetas'],
    };

    function render() {
      renderNav();
      const [title, sub] = TITLES[ROUTE];
      document.getElementById('pageTitle').textContent = title;
      document.getElementById('pageSub').textContent = sub;
      const c = document.getElementById('content');
      const actions = document.getElementById('topbarActions');
      actions.innerHTML = '';
      if (ROUTE === 'dashboard') c.innerHTML = viewDashboard();
      else if (ROUTE === 'estoque') c.innerHTML = viewEstoque();
      else if (ROUTE === 'produtos') c.innerHTML = viewProdutos();
      else if (ROUTE === 'producao') c.innerHTML = viewProducao();
      else if (ROUTE === 'vendas') c.innerHTML = viewVendas();
      else if (ROUTE === 'bipagem') c.innerHTML = viewBipagem();
      else if (ROUTE === 'etiquetas') c.innerHTML = viewEtiquetas();
      else if (ROUTE === 'relatorios') c.innerHTML = viewRelatorios();
      else if (ROUTE === 'config') c.innerHTML = viewConfig();
      afterRender();
    }

    /* ============================================================
       DASHBOARD
       ============================================================ */
    function periodDays(n) {
      const out = [];
      for (let i = n - 1; i >= 0; i--) { out.push(addDays(todayISO(), -i)); }
      return out;
    }

    function vendasFaturamento(v) { return v.itens.reduce((s, i) => s + i.preco * i.qty, 0); }

    function vendaCusto(v) {
      return v.itens.reduce((s, it) => {
        const p = findProduto(it.produtoId);
        if (!p) return s;
        const custoUnit = (p.receita || []).reduce((acc, r) => { const ins = findInsumo(r.insumoId); return acc + (ins ? ins
            .custo * r.qtd : 0); }, 0);
        return s + custoUnit * it.qty;
      }, 0);
    }

    function viewDashboard() {
      const hoje = todayISO();
      const mesRef = hoje.slice(0, 7);
      const vendasMes = DB.vendas.filter(v => v.data.slice(0, 7) === mesRef);
      const faturamentoMes = vendasMes.reduce((s, v) => s + vendasFaturamento(v), 0);
      const custoMes = vendasMes.reduce((s, v) => s + vendaCusto(v), 0);
      const lucroMes = faturamentoMes - custoMes;
      const vendasHoje = DB.vendas.filter(v => v.data === hoje);
      const itensHoje = vendasHoje.reduce((s, v) => s + v.itens.reduce((a, i) => a + i.qty, 0), 0);
      const lowInsumos = DB.insumos.filter(insumoLowStock).length;
      const lowProdutos = DB.produtos.filter(produtoLowStock).length;

      const days = periodDays(14);
      const dayLabels = days.map(d => fmtDate(d).slice(0, 5));
      const dayTotals = days.map(d => DB.vendas.filter(v => v.data === d).reduce((s, v) => s + vendasFaturamento(v), 0));

      const porProduto = {};
      DB.vendas.forEach(v => v.itens.forEach(it => { porProduto[it.produtoId] = (porProduto[it.produtoId] || 0) + it
        .qty; }));
      const topProdutos = Object.entries(porProduto).sort((a, b) => b[1] - a[1]).slice(0, 5)
        .map(([id, qty]) => ({ nome: (findProduto(id) || {}).nome || '—', qty }));

      window.__dash = { dayLabels, dayTotals, topProdutos };

      return `
      <div class="grid grid-4">
        <div class="card stat"><div class="label">Faturamento (mês)</div><div class="value">${fmtMoney(faturamentoMes)}</div><div class="delta">${vendasMes.length} venda(s) no mês</div></div>
        <div class="card stat"><div class="label">Lucro estimado (mês)</div><div class="value">${fmtMoney(lucroMes)}</div><div class="delta">custo insumos: ${fmtMoney(custoMes)}</div></div>
        <div class="card stat"><div class="label">Itens vendidos hoje</div><div class="value">${itensHoje}</div><div class="delta">${vendasHoje.length} venda(s) hoje</div></div>

        <thead><tr><th>Item</th><th>Tipo</th><th>Estoque</th><th>Mínimo</th></tr></thead>
        <tbody>
          ${DB.produtos.filter(produtoLowStock).map(p=>`<tr class="low-stock-row"><td><b>${esc(p.nome)}</b></td><td>Produto</td><td>${p.estoque}</td><td>${p.estoqueMin}</td></tr>`).join('')}
          ${DB.insumos.filter(insumoLowStock).map(i=>`<tr class="low-stock-row"><td><b>${esc(i.nome)}</b></td><td>Insumo</td><td>${i.estoque} ${esc(i.unidade)}</td><td>${i.estoqueMin} ${esc(i.unidade)}</td></tr>`).join('')}
        </tbody>
      </table></div>` : ''}
      `;
    }

    function emptyBlock(title, text) {
      return `<div class="empty" style="height:100%;display:flex;flex-direction:column;justify-content:center;"><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`;
    }

    let chartFatInstance = null,
      chartTopInstance = null;

    function renderDashCharts() {
      const dash = window.__dash;
      if (!dash) return;
      const fatCanvas = document.getElementById('chartFat');
      if (fatCanvas) {
        if (chartFatInstance) chartFatInstance.destroy();
        chartFatInstance = new Chart(fatCanvas, {
          type: 'line',
          data: { labels: dash.dayLabels, datasets: [{ data: dash.dayTotals, borderColor: '#8B5A3C',
              backgroundColor: 'rgba(139, 90, 60, .08)', fill: true, tension: .35, pointRadius: 2 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
            scales: { y: { ticks: { callback: v => 'R$ ' + v } } } }
        });
      }
      const topCanvas = document.getElementById('chartTop');
      if (topCanvas) {
        if (chartTopInstance) chartTopInstance.destroy();
        chartTopInstance = new Chart(topCanvas, {
          type: 'bar',
          data: { labels: dash.topProdutos.map(p => p.nome), datasets: [{ data: dash.topProdutos.map(p => p.qty),
              backgroundColor: '#C29A6B', borderRadius: 6 }] },
          options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } },
            scales: { x: { ticks: { stepSize: 1 } } } }
        });
      }
    }

    /* ============================================================
       ESTOQUE & INSUMOS
       ============================================================ */
    function viewEstoque() {
      document.getElementById('topbarActions').innerHTML =
        `<button class="btn btn-primary" id="btnAddInsumo">+ Novo insumo</button>`;
      const rows = DB.insumos.map(i => `
        <tr class="${insumoLowStock(i)?'low-stock-row':''}">
          <td><b>${esc(i.nome)}</b></td>
          <td class="mono">${i.estoque} ${esc(i.unidade)}</td>
          <td class="mono">${i.estoqueMin} ${esc(i.unidade)}</td>
          <td class="mono">${fmtMoney(i.custo)}</td>
          <td>${insumoLowStock(i)?'<span class="badge badge-danger">baixo</span>':'<span class="badge badge-ok">ok</span>'}</td>
          <td style="text-align:right;white-space:nowrap;">

        </tr>`).join('');
      return `
      <div class="help-note"><b>Como funciona:</b> os insumos são baixados automaticamente ${DB.config.deducaoInsumos==='saida' ? 'quando um item é bipado/vendido' : 'no momento em que você registra uma produção'}.</div>
      <div class="card table-wrap">
        <table>
          <thead><tr><th>Insumo</th><th>Estoque</th><th>Mínimo</th><th>Custo unit.</th><th>Status</th><th></th></tr></thead>
          <tbody>${rows || `<tr><td colspan="6"><div class="empty"><h3>Nenhum insumo cadastrado</h3></div></td></tr>`}</tbody>
        </table>
      </div>`;
    }

    function iconEdit() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'; }

    function iconTrash() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>'; }

    function openInsumoModal(existing) {
      const isEdit = !!existing;
      const it = existing || { nome: '', unidade: 'un', estoque: 0, estoqueMin: 0, custo: 0 };
      showModal({
        title: isEdit ? 'Editar insumo' : 'Novo insumo',
        body: `
          <div class="field"><label>Nome</label><input class="input" id="f-nome" value="${esc(it.nome)}" placeholder="Ex: Leite condensado"></div>
          <div class="field-row">
            <div class="field"><label>Unidade</label>
              <select id="f-unidade">
                ${['un','kg','g','l','ml','cx','pct'].map(u=>`<option value="${u}" ${it.unidade===u?'selected':''}>${u}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Custo unitário (R$)</label><input class="input" id="f-custo" type="number" step="0.01" value="${it.custo}"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Estoque atual</label><input class="input" id="f-estoque" type="number" step="0.001" value="${it.estoque}"></div>
            <div class="field"><label>Estoque mínimo</label><input class="input" id="f-min" type="number" step="0.001" value="${it.estoqueMin}"></div>
          </div>
        `,
        onSave: () => {
          const nome = document.getElementById('f-nome').value.trim();
          if (!nome) { toast('Informe o nome do insumo', 'err'); return false; }
          const data = {
            nome,
            unidade: document.getElementById('f-unidade').value,
            custo: parseFloat(document.getElementById('f-custo').value) || 0,
            estoque: parseFloat(document.getElementById('f-estoque').value) || 0,
            estoqueMin: parseFloat(document.getElementById('f-min').value) || 0,
          };

          return true;

    /* ============================================================
       PRODUTOS
       ============================================================ */
    function viewProdutos() {
      document.getElementById('topbarActions').innerHTML =
        `<button class="btn btn-primary" id="btnAddProduto">+ Novo produto</button>`;
      const rows = DB.produtos.map(p => `
        <tr class="${produtoLowStock(p)?'low-stock-row':''}">
          <td><b>${esc(p.nome)}</b><div class="hint mono">${esc(p.sku)}</div></td>

          <td class="mono">${p.estoque}</td>

    function openProdutoModal(existing) {
      const isEdit = !!existing;
      const p = existing || { 
        nome: '', 
        sku: '', 
        categoria: '', 
        preco: 0, 
        validadeDias: 3, 
        estoque: 0, 
        estoqueMin: 5,
        pesoMedio: 0,
        receita: [] 
      };
      let receita = JSON.parse(JSON.stringify(p.receita || []));

      function receitaRowsHtml() {
        if (!receita.length) return `<div class="hint" style="padding:10px;text-align:center;color:var(--muted);">Nenhum insumo adicionado ainda.</div>`;
        return receita.map((r, idx) => {
          const insumo = findInsumo(r.insumoId);
          return `
          <div class="recipe-row" data-ridx="${idx}">
            <select data-rfield="insumoId" class="input" style="flex:2;">
              <option value="">Selecione um insumo...</option>
              ${DB.insumos.map(i=>`<option value="${i.id}" ${r.insumoId===i.id?'selected':''}>${esc(i.nome)} (${esc(i.unidade)})</option>`).join('')}
            </select>
            <input type="number" step="0.001" data-rfield="qtd" class="input" value="${r.qtd || 0}" placeholder="qtd/unid." style="flex:1;">
            <button class="btn btn-danger btn-sm" data-rdel="${idx}">✕</button>
          </div>`;
        }).join('');
      }

      showModal({
        title: isEdit ? 'Editar produto' : 'Novo produto',
        wide: true,
        body: `
          <div class="field"><label>Nome do produto</label><input class="input" id="f-nome" value="${esc(p.nome)}" placeholder="Ex: Palha Italiana Tradicional"></div>
          <div class="field-row">
            <div class="field"><label>SKU / Código</label><input class="input" id="f-sku" value="${esc(p.sku)}" placeholder="gerado automaticamente"></div>
            <div class="field"><label>Categoria</label><input class="input" id="f-categoria" value="${esc(p.categoria||'')}" placeholder="Ex: Doces"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Preço de venda (R$)</label><input class="input" id="f-preco" type="number" step="0.01" value="${p.preco}"></div>
            <div class="field"><label>Validade (dias)</label><input class="input" id="f-validade" type="number" step="1" value="${p.validadeDias}"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Estoque atual</label><input class="input" id="f-estoque" type="number" step="1" value="${p.estoque}"></div>
            <div class="field"><label>Estoque mínimo</label><input class="input" id="f-min" type="number" step="1" value="${p.estoqueMin}"></div>
          </div>
          <div class="field"><label>Peso médio do produto (kg)</label><input class="input" id="f-peso" type="number" step="0.001" value="${p.pesoMedio || 0}" placeholder="Ex: 0.150"></div>
          
          <div class="divider"></div>
          
          <div class="recipe-header">
            <label>Ficha técnica (insumos por unidade)</label>
            <span class="badge-insumos">${receita.length} insumo(s)</span>
          </div>
          
          <div id="recRows" style="margin-bottom:10px;">${receitaRowsHtml()}</div>
          
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-secondary btn-sm" id="btnAddRecipe" type="button" ${!DB.insumos.length?'disabled':''}>
              + Adicionar insumo
            </button>
            ${isEdit && receita.length > 0 ? `<button class="btn btn-danger btn-sm" id="btnClearRecipe" type="button">Limpar todos</button>` : ''}
          </div>
          ${!DB.insumos.length ? '<div class="hint" style="color:var(--red);margin-top:8px;">⚠ Crie insumos primeiro na aba "Estoque & Insumos"</div>' : ''}
        `,
        onMount: (modalEl) => {
          modalEl.querySelector('#btnAddRecipe').onclick = () => {
            if (!DB.insumos.length) {
              toast('Crie insumos primeiro na aba "Estoque & Insumos"', 'err');
              return;
            }
            receita.push({ insumoId: DB.insumos[0].id, qtd: 0 });
            modalEl.querySelector('#recRows').innerHTML = receitaRowsHtml();
            bindRecipeRows(modalEl);
            const badge = modalEl.querySelector('.badge-insumos');
            if (badge) badge.textContent = receita.length + ' insumo(s)';
          };

          const clearBtn = modalEl.querySelector('#btnClearRecipe');
          if (clearBtn) {
            clearBtn.onclick = () => {
              if (receita.length === 0) return;
              if (confirm('Remover todos os insumos da ficha técnica?')) {
                receita = [];
                modalEl.querySelector('#recRows').innerHTML = receitaRowsHtml();
                bindRecipeRows(modalEl);
                const badge = modalEl.querySelector('.badge-insumos');
                if (badge) badge.textContent = '0 insumo(s)';
                toast('Todos os insumos removidos', 'ok');
              }
            };
          }

          bindRecipeRows(modalEl);

          function bindRecipeRows(modalEl) {
            modalEl.querySelectorAll('[data-rdel]').forEach(b => {
              b.onclick = () => {
                const idx = parseInt(b.dataset.rdel);
                const insumo = findInsumo(receita[idx]?.insumoId);
                if (confirm(`Remover "${insumo?.nome || 'este insumo'}" da ficha técnica?`)) {
                  receita.splice(idx, 1);
                  modalEl.querySelector('#recRows').innerHTML = receitaRowsHtml();
                  bindRecipeRows(modalEl);
                  const badge = modalEl.querySelector('.badge-insumos');
                  if (badge) badge.textContent = receita.length + ' insumo(s)';
                  toast('Insumo removido', 'ok');
                }
              };
            });

            modalEl.querySelectorAll('[data-rfield]').forEach(inp => {
              const updateField = () => {
                const row = inp.closest('[data-ridx]');
                if (!row) return;
                const idx = parseInt(row.dataset.ridx);
                const field = inp.dataset.rfield;
                if (field === 'qtd') {
                  receita[idx][field] = parseFloat(inp.value) || 0;
                } else {
                  receita[idx][field] = inp.value;
                }
              };
              inp.onchange = updateField;
              inp.oninput = updateField;
            });
          }
        },
        onSave: () => {
          const nome = document.getElementById('f-nome').value.trim();
          if (!nome) { toast('Informe o nome do produto', 'err'); return false; }
          
          let sku = document.getElementById('f-sku').value.trim();
          if (!sku) sku = slug(nome) + (isEdit ? '' : '-' + Math.floor(Math.random() * 90 + 10));
          
          const receitaFiltrada = receita.filter(r => r.insumoId && r.qtd > 0);
          
          const data = {
            nome,
            sku,
            categoria: document.getElementById('f-categoria').value.trim(),
            preco: parseFloat(document.getElementById('f-preco').value) || 0,
            validadeDias: parseInt(document.getElementById('f-validade').value) || 0,
            estoque: parseFloat(document.getElementById('f-estoque').value) || 0,
            estoqueMin: parseFloat(document.getElementById('f-min').value) || 0,
            pesoMedio: parseFloat(document.getElementById('f-peso').value) || 0,
            receita: receitaFiltrada,
          };

          if (isEdit) { 
            Object.assign(p, data); 
          } else { 
            DB.produtos.push({ id: uid(), ...data }); 
          }
          
          persist('produtos');
          render();
          toast(`Produto salvo com ${receitaFiltrada.length} insumo(s)`, 'ok');
          return true;
        }
      });
    }

    /* ============================================================
       PRODUÇÃO
       ============================================================ */
    function gerarLote() {
      const d = new Date();
      const ymd = d.toISOString().slice(0, 10).replace(/-/g, '');
      const seq = String(DB.producoes.length + 1).padStart(2, '0');
      return `${ymd}${seq}`;
    }

    function viewProducao() {
      document.getElementById('topbarActions').innerHTML =
        `<button class="btn btn-primary" id="btnNovaProducao" ${!DB.produtos.length?'disabled':''}>+ Registrar produção</button>`;
      const rows = DB.producoes.slice().reverse().map(pr => {
        const p = findProduto(pr.produtoId);
        const disponivel = pr.itens.filter(i => i.status === 'estoque').length;
        const vendidos = pr.quantidade - disponivel;
        return `<tr>
          <td class="mono"><span class="tag-num">${esc(pr.lote)}</span></td>
          <td><b>${esc(p? p.nome : '(produto removido)')}</b></td>
          <td class="mono">${pr.quantidade}</td>
          <td class="mono">${p && p.pesoMedio ? (pr.quantidade * p.pesoMedio).toFixed(2) + ' kg' : '—'}</td>
          <td>${fmtDate(pr.data)}</td>
          <td>${fmtDate(pr.validade)}</td>
          <td>${disponivel}/${pr.quantidade} em estoque</td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="btn btn-secondary btn-sm" data-print-lote="${pr.id}">Etiquetas</button>
            <button class="icon-btn" data-edit-producao="${pr.id}" title="Editar produção">${iconEdit()}</button>
            <button class="icon-btn" data-del-producao="${pr.id}" title="Excluir produção" ${vendidos>0?`data-vendidos="${vendidos}"`:''}>${iconTrash()}</button>
          </td>
        </tr>`;
      }).join('');
      return `
      <div class="card table-wrap">
        <table>
          <thead><tr><th>Lote</th><th>Produto</th><th>Qtd</th><th>Peso total</th><th>Produção</th><th>Validade</th><th>Situação</th><th></th></tr></thead>
          <tbody>${rows || `<tr><td colspan="8"><div class="empty"><h3>Nenhuma produção registrada</h3></div></td></tr>`}</tbody>
        </table>
      </div>`;
    }

    function openProducaoModal() {
      showModal({
        title: 'Registrar produção',
        body: `
          <div class="field"><label>Produto</label>
            <select id="f-produto">${DB.produtos.map(p=>`<option value="${p.id}">${esc(p.nome)} - ${fmtMoney(p.preco)}</option>`).join('')}</select>
          </div>
          <div class="field-row">
            <div class="field"><label>Quantidade produzida</label><input class="input" id="f-qtd" type="number" min="1" step="1" value="10"></div>
            <div class="field"><label>Peso total (kg)</label><input class="input" id="f-peso-total" type="number" step="0.001" value="" placeholder="calculado automaticamente" readonly style="background:var(--surface-2);"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Data de produção</label><input class="input" id="f-data" type="date" value="${todayISO()}"></div>
            <div class="field"><label>Validade</label><input class="input" id="f-validade" type="date" value="" readonly style="background:var(--surface-2);"></div>
          </div>
          <div class="hint" id="recipePreview"></div>
        `,
        onMount: (modalEl) => {
          const sel = modalEl.querySelector('#f-produto');
          const qtdInp = modalEl.querySelector('#f-qtd');
          const pesoTotal = modalEl.querySelector('#f-peso-total');
          const validadeInp = modalEl.querySelector('#f-validade');
          const dataInp = modalEl.querySelector('#f-data');

          function updatePreview() {
            const p = findProduto(sel.value);
            const qty = parseFloat(qtdInp.value) || 0;
            
            if (p && p.pesoMedio) {
              pesoTotal.value = (qty * p.pesoMedio).toFixed(2);
            } else {
              pesoTotal.value = '—';
            }
            
            if (p && dataInp.value) {
              const validade = addDays(dataInp.value, p.validadeDias);
              validadeInp.value = validade;
            }
            
            if (!p || !p.receita || !p.receita.length) { 
              modalEl.querySelector('#recipePreview').textContent = '⚠ Este produto não tem insumos cadastrados.';
              return; 
            }
            const parts = p.receita.map(r => { 
              const ins = findInsumo(r.insumoId); 
              return ins ? `${esc(ins.nome)}: ${(r.qtd * qty).toFixed(3)} ${esc(ins.unidade)}` : ''; 
            }).filter(Boolean);
            modalEl.querySelector('#recipePreview').innerHTML = '📦 Insumos necessários: ' + parts.join(' · ');
          }
          
          sel.onchange = updatePreview;
          qtdInp.oninput = updatePreview;
          dataInp.onchange = updatePreview;
          updatePreview();
        },
        onSave: () => {
          const produtoId = document.getElementById('f-produto').value;
          const qty = parseInt(document.getElementById('f-qtd').value) || 0;
          const data = document.getElementById('f-data').value || todayISO();
          if (qty <= 0) { toast('Informe uma quantidade válida', 'err'); return false; }
          const p = findProduto(produtoId);
          const lote = gerarLote();
          const validade = addDays(data, p.validadeDias);
          const itens = [];
          for (let i = 1; i <= qty; i++) {
            itens.push({ codigo: `${p.sku}-${lote}-${String(i).padStart(3,'0')}`, seq: i, status: 'estoque' });
          }
          DB.producoes.push({ id: uid(), produtoId, quantidade: qty, data, lote, validade, itens });
          p.estoque = (p.estoque || 0) + qty;
          if (DB.config.deducaoInsumos === 'producao') { deduzInsumos(p, qty);
            persist('insumos'); }
          persist('producoes', 'produtos');
          render();
          toast(`Produção registrada — lote ${lote}`, 'ok');
          setRoute('etiquetas');
          ETQ_FILTER_LOTE = lote;
          render();
          return true;
        }
      });
    }

    function openEditProducaoModal(pr) {
      const p = findProduto(pr.produtoId);
      const vendidos = pr.itens.filter(i => i.status !== 'estoque').length;
      showModal({
        title: `Editar produção — lote ${pr.lote}`,
        body: `
          <div class="help-note"><b>Produto:</b> ${esc(p? p.nome : '(produto removido)')} — o produto e o lote não podem ser alterados após a produção ser registrada.</div>
          <div class="field-row">
            <div class="field"><label>Quantidade produzida</label><input class="input" id="f-eqtd" type="number" min="${vendidos||1}" step="1" value="${pr.quantidade}"></div>
            <div class="field"><label>Peso total (kg)</label><input class="input" id="f-epeso" type="number" step="0.001" value="${p && p.pesoMedio ? (pr.quantidade*p.pesoMedio).toFixed(2) : ''}" readonly style="background:var(--surface-2);"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Data de produção</label><input class="input" id="f-edata" type="date" value="${pr.data}"></div>
            <div class="field"><label>Validade</label><input class="input" id="f-evalidade" type="date" value="${pr.validade}" readonly style="background:var(--surface-2);"></div>
          </div>
          ${vendidos ? `<div class="help-note">⚠ ${vendidos} unidade(s) deste lote já foram vendidas/baixadas e não podem ser removidas — a quantidade mínima é ${vendidos}.</div>` : ''}
          <div class="hint" id="editRecipePreview"></div>
        `,
        onMount: (modalEl) => {
          const qtdInp = modalEl.querySelector('#f-eqtd');
          const pesoInp = modalEl.querySelector('#f-epeso');
          const dataInp = modalEl.querySelector('#f-edata');
          const validadeInp = modalEl.querySelector('#f-evalidade');
          function updatePreview() {
            const qty = parseInt(qtdInp.value) || 0;
            if (p && p.pesoMedio) pesoInp.value = (qty * p.pesoMedio).toFixed(2);
            if (p && dataInp.value) validadeInp.value = addDays(dataInp.value, p.validadeDias);
            const delta = qty - pr.quantidade;
            const prev = modalEl.querySelector('#editRecipePreview');
            if (!p || !p.receita || !p.receita.length || DB.config.deducaoInsumos !== 'producao') { prev.innerHTML = ''; return; }
            if (delta === 0) { prev.innerHTML = ''; return; }
            const parts = p.receita.map(r => {
              const ins = findInsumo(r.insumoId);
              if (!ins) return '';
              const amount = Math.abs(r.qtd * delta);
              return `${esc(ins.nome)}: ${amount.toFixed(3)} ${esc(ins.unidade)}`;
            }).filter(Boolean);
            prev.innerHTML = (delta > 0 ? '📦 Insumos adicionais a baixar: ' : '↩ Insumos a devolver ao estoque: ') + parts.join(' · ');
          }
          qtdInp.oninput = updatePreview;
          dataInp.onchange = updatePreview;
          updatePreview();
        },
        onSave: () => {
          const newQty = parseInt(document.getElementById('f-eqtd').value) || 0;
          const newData = document.getElementById('f-edata').value || pr.data;
          const newValidade = document.getElementById('f-evalidade').value || pr.validade;
          if (newQty <= 0) { toast('Informe uma quantidade válida', 'err'); return false; }
          if (newQty < vendidos) { toast(`A quantidade não pode ser menor que ${vendidos} (unidades já vendidas)`, 'err'); return false; }
          const delta = newQty - pr.quantidade;

          if (delta > 0) {
            for (let i = pr.quantidade + 1; i <= newQty; i++) {
              pr.itens.push({ codigo: `${p.sku}-${pr.lote}-${String(i).padStart(3,'0')}`, seq: i, status: 'estoque' });
            }
          } else if (delta < 0) {
            let toRemove = -delta;
            for (let i = pr.itens.length - 1; i >= 0 && toRemove > 0; i--) {
              if (pr.itens[i].status === 'estoque') { pr.itens.splice(i, 1);
                toRemove--; }
            }
          }
          pr.quantidade = newQty;
          pr.data = newData;
          pr.validade = newValidade;

          if (p) {
            p.estoque = Math.max(0, (p.estoque || 0) + delta);
            if (DB.config.deducaoInsumos === 'producao' && delta !== 0) {
              deduzInsumos(p, delta);
              persist('insumos');
            }
          }
          persist('producoes', 'produtos');
          render();
          toast('Produção atualizada', 'ok');
          return true;
        }
      });
    }

    function makeQrImg(text, size) {
      size = size || 4;
      try {
        let qr;
        for (let tn = 0; tn <= 12; tn++) {
          try { qr = qrcode(tn, 'M');
            qr.addData(text);
            qr.make(); break; } catch (e) { qr = null; }
        }
        if (!qr) return '';
        return qr.createImgTag(size, 4);
      } catch (e) { return ''; }
    }

    function cartLineHtml(l, idx) {
      return `<div class="cart-line">

          ${l.kind==='manual' ? `<button data-cartqty="${idx}" data-d="-1">−</button><span class="mono">${l.qty}</span><button data-cartqty="${idx}" data-d="1">+</button>` : `<span class="mono">${l.qty}x</span>`}

    function addScanToCart(code) {
      const found = findItemByCode(code);
      if (!found) { toast('Código não encontrado', 'err'); return; }
      if (found.item.status !== 'estoque') { toast('Item já foi baixado do estoque', 'err'); return; }
      if (SALE_CART.some(l => l.codigo === found.item.codigo)) { toast('Item já está no carrinho', 'err'); return; }
      const p = findProduto(found.producao.produtoId);
      SALE_CART.push({ kind: 'scan', codigo: found.item.codigo, produtoId: p.id, qty: 1, preco: p.preco, nome: p.nome });
      render();
    }

    function addManualToCart(produtoId, qty) {
      const p = findProduto(produtoId);
      if (!p || qty <= 0) return;
      const existing = SALE_CART.find(l => l.kind === 'manual' && l.produtoId === produtoId);
      if (existing) existing.qty += qty;
      else SALE_CART.push({ kind: 'manual', produtoId, qty, preco: p.preco, nome: p.nome });
      render();
    }

    function finalizarVenda() {
      if (!SALE_CART.length) return;
      SALE_CART.forEach(l => {
        const p = findProduto(l.produtoId);
        if (l.kind === 'scan') {
          const found = findItemByCode(l.codigo);
          if (found) found.item.status = 'saida';
          p.estoque = Math.max(0, (p.estoque || 0) - 1);
        } else {
          p.estoque = Math.max(0, (p.estoque || 0) - l.qty);
        }
        if (DB.config.deducaoInsumos === 'saida') { deduzInsumos(p, l.qty); }
      });
      const venda = {
        id: uid(),
        data: todayISO(),
        hora: new Date().toTimeString().slice(0, 5),
        pagamento: document.getElementById('formaPagamento').value,
        itens: SALE_CART.map(l => ({ produtoId: l.produtoId, qty: l.qty, preco: l.preco, codigo: l.codigo || null })),
      };
      DB.vendas.push(venda);
      persist('vendas', 'produtos', 'insumos', 'producoes');
      SALE_CART = [];
      render();
      toast('Venda registrada!', 'ok');
    }

    function processBipagem(code) {
      const found = findItemByCode(code);
      if (!found) { toast('Código não encontrado', 'err'); return; }
      if (found.item.status !== 'estoque') { toast('Item já foi baixado', 'err'); return; }
      const p = findProduto(found.producao.produtoId);
      found.item.status = 'saida';
      p.estoque = Math.max(0, (p.estoque || 0) - 1);
      if (DB.config.deducaoInsumos === 'saida') { deduzInsumos(p, 1); }
      const motivo = document.getElementById('bipMotivo') ? document.getElementById('bipMotivo').value : 'venda_avulsa';
      DB.scanlog.push({ codigo: found.item.codigo, produtoNome: p.nome, produtoId: p.id, datahora: nowISO(), motivo,
        motivoLabel: MOTIVO_LABELS[motivo] || motivo });
      persist('produtos', 'insumos', 'producoes', 'scanlog');

    /* ---------------- Câmera Leitora ---------------- */
    const CameraScan = {
      active: { vendas: false, bipagem: false },
      instance: { vendas: null, bipagem: null },
      starting: { vendas: false, bipagem: false },
    };

    async function stopCamera(key) {
      const inst = CameraScan.instance[key];
      CameraScan.instance[key] = null;
      if (inst) {
        try { 
          await inst.stop(); 
          await inst.clear(); 
        } catch (e) {
          console.log('Camera stop error:', e);
        }
      }
    }

    function startCamera(key, elId, onDecode) {
      if (CameraScan.starting[key] || CameraScan.instance[key]) return;
      
      const el = document.getElementById(elId);
      if (!el) {
        toast('Elemento da câmera não encontrado', 'err');
        return;
      }

      if (typeof Html5Qrcode === 'undefined') {
        toast('Leitor indisponível. Verifique a conexão.', 'err');
        CameraScan.active[key] = false;
        render();
        return;
      }

      el.innerHTML = '<div id="' + elId + '-box" style="width:100%;max-width:400px;margin:0 auto;"></div>';
      
      try {
        const inst = new Html5Qrcode(elId + '-box');
        CameraScan.instance[key] = inst;
        CameraScan.starting[key] = true;

        const config = {
          fps: 15,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1.0
        };

        inst.start(
          { facingMode: "environment" },
          config,
          (decodedText) => {
            stopCamera(key).then(() => {
              onDecode(decodedText);
              render();
            });
          },
          (errorMessage) => {}
        ).catch((err) => {
          console.error('Camera start error:', err);
          CameraScan.instance[key] = null;
          CameraScan.active[key] = false;
          toast('Erro ao acessar a câmera. Verifique as permissões.', 'err');
          render();
        }).finally(() => {
          CameraScan.starting[key] = false;
        });
      } catch (err) {
        console.error('Camera init error:', err);
        CameraScan.active[key] = false;
        toast('Erro ao iniciar a câmera', 'err');
        render();
      }
    }

    function relatorioRows() {
      const de = document.getElementById('relDe') ? document.getElementById('relDe').value : addDays(todayISO(), -30);
      const ate = document.getElementById('relAte') ? document.getElementById('relAte').value : todayISO();
      const vendasPeriodo = DB.vendas.filter(v => v.data >= de && v.data <= ate);

      if (REL_TAB === 'faturamento') {
        const total = vendasPeriodo.reduce((s, v) => s + vendasFaturamento(v), 0);
        const custo = vendasPeriodo.reduce((s, v) => s + vendaCusto(v), 0);
        return {
          headers: ['Data', 'Itens', 'Pagamento', 'Total'],
          rows: vendasPeriodo.slice().reverse().map(v => [fmtDate(v.data), v.itens.map(i =>
              `${i.qty}x ${(findProduto(i.produtoId)||{}).nome||'?'}`).join('; '), v.pagamento, fmtMoney(vendasFaturamento(
              v))]),
          footerHtml: `<div class="grid grid-3" style="margin-top:16px;">
            <div class="card stat"><div class="label">Faturamento</div><div class="value">${fmtMoney(total)}</div></div>
            <div class="card stat"><div class="label">Custo insumos</div><div class="value">${fmtMoney(custo)}</div></div>
            <div class="card stat"><div class="label">Lucro estimado</div><div class="value">${fmtMoney(total-custo)}</div></div>
          </div>`,
          csv: [
            ['Data', 'Hora', 'Itens', 'Pagamento', 'Total'],
            ...vendasPeriodo.map(v => [v.data, v.hora || '', v.itens.map(i =>
                `${i.qty}x ${(findProduto(i.produtoId)||{}).nome||'?'}`).join(' | '), v.pagamento, vendasFaturamento(v)
              .toFixed(2)
            ])
          ]
        };
      }
      if (REL_TAB === 'produtos') {
        const map = {};
        vendasPeriodo.forEach(v => v.itens.forEach(it => { map[it.produtoId] = map[it.produtoId] || { qty: 0,
            total: 0 };
          map[it.produtoId].qty += it.qty;
          map[it.produtoId].total += it.qty * it.preco; }));
        const arr = Object.entries(map).map(([id, v]) => ({ nome: (findProduto(id) || {}).nome || '(removido)',
          ...v })).sort((a, b) => b.qty - a.qty);
        return {
          headers: ['Produto', 'Qtd. vendida', 'Faturamento'],
          rows: arr.map(a => [a.nome, a.qty, fmtMoney(a.total)]),
          csv: [
            ['Produto', 'Qtd', 'Faturamento'],
            ...arr.map(a => [a.nome, a.qty, a.total.toFixed(2)])
          ]
        };
      }
      if (REL_TAB === 'insumos') {
        const map = {};
        vendasPeriodo.forEach(v => v.itens.forEach(it => {
          const p = findProduto(it.produtoId);
          if (!p) return;
          (p.receita || []).forEach(r => { const ins = findInsumo(r.insumoId); if (!ins) return;
            map[r.insumoId] = map[r.insumoId] || { nome: ins.nome, unidade: ins.unidade, qtd: 0,
              custo: 0 };
            map[r.insumoId].qtd += r.qtd * it.qty;
            map[r.insumoId].custo += r.qtd * it.qty * ins.custo; });
        }));
        const arr = Object.values(map).sort((a, b) => b.custo - a.custo);
        return {
          headers: ['Insumo', 'Consumo', 'Custo est.'],
          rows: arr.map(a => [a.nome, `${a.qtd.toFixed(2)} ${a.unidade}`, fmtMoney(a.custo)]),
          csv: [
            ['Insumo', 'Consumo', 'Unidade', 'Custo'],
            ...arr.map(a => [a.nome, a.qtd.toFixed(2), a.unidade, a.custo.toFixed(2)])
          ]
        };
      }
      if (REL_TAB === 'estoque') {
        const arr = [
          ...DB.produtos.map(p => ['Produto', p.nome, p.estoque, p.estoqueMin, produtoLowStock(p) ? 'BAIXO' : 'ok']),
          ...DB.insumos.map(i => ['Insumo', i.nome, `${i.estoque} ${i.unidade}`, `${i.estoqueMin} ${i.unidade}`,
            insumoLowStock(i) ? 'BAIXO' : 'ok'
          ]),
        ];
        return { headers: ['Tipo', 'Nome', 'Estoque', 'Mínimo', 'Status'], rows: arr, csv: [
            ['Tipo', 'Nome', 'Estoque', 'Mínimo', 'Status'],
            ...arr
          ] };
      }
    }

    function exportAllData() {
      try {
        const data = {
          config: DB.config,
          insumos: DB.insumos,
          produtos: DB.produtos,
          producoes: DB.producoes,
          vendas: DB.vendas,
          scanlog: DB.scanlog,
          exportedAt: nowISO(),
          version: '1.0'
        };
        
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `almeida-doceria-backup-${todayISO()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        
        toast(`Backup exportado com ${DB.produtos.length} produtos, ${DB.insumos.length} insumos e ${DB.vendas.length} vendas`, 'ok');
      } catch (e) {
        toast('Erro ao exportar dados: ' + e.message, 'err');
        console.error(e);
      }
    }

    function importAllData(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          
          // Validação básica
          if (!data.config || !data.insumos || !data.produtos || !data.producoes || !data.vendas || !data.scanlog) {
            toast('Arquivo inválido. Certifique-se de que é um backup válido.', 'err');
            return;
          }
          
          // Confirmação antes de sobrescrever
          if (!confirm(`⚠ ATENÇÃO: Isso substituirá TODOS os dados atuais!\n\nDados do backup:\n• ${data.produtos.length} produtos\n• ${data.insumos.length} insumos\n• ${data.producoes.length} produções\n• ${data.vendas.length} vendas\n\nExportado em: ${fmtDateTime(data.exportedAt)}\n\nDeseja continuar?`)) {
            return;
          }
          
          // Substitui os dados
          DB.config = data.config;
          DB.insumos = data.insumos;
          DB.produtos = data.produtos;
          DB.producoes = data.producoes;
          DB.vendas = data.vendas;
          DB.scanlog = data.scanlog;
          
          // Salva todos os dados
          persist('config', 'insumos', 'produtos', 'producoes', 'vendas', 'scanlog');
          
          render();
          toast(`✅ Dados importados com sucesso! ${data.produtos.length} produtos, ${data.insumos.length} insumos`, 'ok');
        } catch (e) {
          toast('Erro ao importar dados: ' + e.message, 'err');
          console.error(e);
        }
      };
      reader.readAsText(file);
    }

    function showModal({ title, body, onSave, onMount, wide }) {
      const root = document.getElementById('modalRoot');

          </div>
        </div>`;
      const close = () => root.innerHTML = '';
      document.getElementById('modalCloseX').onclick = close;
      document.getElementById('modalCancel').onclick = close;
      document.getElementById('modalBackdrop').onclick = (e) => { if (e.target.id === 'modalBackdrop') close(); };
      document.getElementById('modalSave').onclick = () => { if (onSave() !== false) close(); };
      if (onMount) onMount(root.querySelector('.modal'));
    }

      document.getElementById('modalSave').textContent = 'Excluir';

    function afterRender() {
      if (ROUTE === 'dashboard') { renderDashCharts(); }

      if (ROUTE === 'estoque') {
        const add = document.getElementById('btnAddInsumo');
        if (add) add.onclick = () => openInsumoModal(null);

        document.querySelectorAll('[data-del-insumo]').forEach(b => b.onclick = () => {
          const ins = findInsumo(b.dataset.delInsumo);
          confirmDelete(`Excluir o insumo "${ins.nome}"?`, () => {
            DB.insumos = DB.insumos.filter(i => i.id !== ins.id);
            persist('insumos');
            render();
            toast('Insumo excluído', 'ok');
          });
        });
        document.querySelectorAll('[data-adj]').forEach(b => b.onclick = () => {
          const ins = findInsumo(b.dataset.adj);
          const sign = parseInt(b.dataset.sign);
          const step = ins.unidade === 'un' ? 1 : 0.1;
          ins.estoque = Math.max(0, Math.round((ins.estoque + sign * step) * 10000) / 10000);
          persist('insumos');
          render();
        });

      if (ROUTE === 'produtos') {
        const add = document.getElementById('btnAddProduto');
        if (add) add.onclick = () => openProdutoModal(null);

          const p = findProduto(b.dataset.delProduto);

            persist('produtos');
            render();
